services:
    db:
        image: postgres
        secrets:
            - db_password
        environment:
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        volumes:
            - db-volume:/var/lib/postgresql
        ports:
            - 5432
    nginx:
        build: ./nginx
        ports:
            - 80:80
        secrets:
            - ssl_cert
            - ssl_key
    app:
        build: ./app
        expose:
            - 8000
secrets:
    db_password:
        file: ./secrets/db_password
    ssl_cert:
        file: ./secrets/fullchain.pem
    ssl_key:
        file: ./secrets/privkey.pem
volumes:
    db-volume:

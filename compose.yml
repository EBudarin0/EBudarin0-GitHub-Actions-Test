services:
    db:
        image: postgres
        secrets:
            - db_password
        environment:
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        volumes:
            - db-volume:/var/lib/postgresql
        ports:
            - 5432
    app:
        build: ./app
        ports:
            - 8000
secrets:
    db_password:
        file: ./secrets/db_password
volumes:
    db-volume:

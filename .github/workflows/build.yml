name: Build Workflow
run-name: ${{ github.actor }} builds images
on: [workflow_dispatch]
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - run: docker compose build
      - run: docker save -o app.tar ebudarin0-github-actions-test-app
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ./app.tar
